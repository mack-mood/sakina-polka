<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Rare Polka</title>

  <!-- Opens with no browser bars when launched from the Home Screen -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Rare Polka">
  <link rel="apple-touch-icon" href="icons/180x180.png">
  <link rel="manifest" href="manifest.json">

  <!-- Her own p5.js 2.3.4 and p5.sound files from the Web Editor download -->
  <script src="p5.js"></script>
  <script src="p5.sound.min.js"></script>
  <link rel="stylesheet" type="text/css" href="style.css">

  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: black;

      /* Stop scrolling, bouncing, zooming, text selection and the
         long-press menu. Important because the sketch uses a 4 second hold. */
      overscroll-behavior: none;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }

    canvas {
      display: block;
    }

    /* Tap-to-start cover. The iPad only lets a page play sound
       after the first tap, so this tap turns the sound on. */
    #start-button {
      position: fixed;
      inset: 0;
      z-index: 200;
      border: none;
      background: black;
      color: white;
      font-family: sans-serif;
      font-size: 46px;
      cursor: pointer;
    }
  </style>
</head>

<body>
  <button id="start-button">tap to start</button>

  <script>
    const startButton = document.getElementById('start-button')

    // Keep this tap away from the sketch, so it does not start the black hole
    startButton.addEventListener('pointerdown', (e) => e.stopPropagation())
    startButton.addEventListener('pointerup', (e) => e.stopPropagation())

    startButton.addEventListener('click', () => {
      // Turn the sound on (play and stop straight away)
      if (typeof vibrationSound !== 'undefined' && vibrationSound) {
        vibrationSound.play().then(() => {
          vibrationSound.pause()
          vibrationSound.currentTime = 0
        }).catch((error) => {
          console.log('Audio unlock:', error)
        })
        audioUnlocked = true
      }

      startButton.remove()
    })
  </script>

  <script src="sketch.js"></script>
</body>
</html>
